<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shuk HaTikvah · 360° Exploration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* ui_alex: full-bleed 360 stage with floating UI. The view follows the walking direction until the user drags.
   Entities are marked with a pointer dot + leader line to a dark info window (no boxes). Bottom right: a round
   north-up mini map like the Lens design; live once the walk is placed on the map (data/processed/<walk>/georef.json). */
:root {
  --person: #f5c518; --object: #ef4b5f; --space: #3d8bff; --ink: #1d2433; --soft: #6b7385; --line: #e7e9ef;
  --glass: rgba(255,255,255,.92); --shadow: 0 10px 30px rgba(20,25,40,.18);
  --win: rgba(16,18,24,.82); --win-soft: #b9bfcb;
  --sans: "Inter", -apple-system, "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { font: 13px/1.4 var(--sans); color: var(--ink); background: #0d1117; display: flex; flex-direction: column; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
svg { display: block; }

/* ---- top bar ---- */
header { height: 54px; flex: none; background: #fff; display: flex; align-items: center; padding: 0 18px; gap: 18px; border-bottom: 1px solid var(--line); z-index: 20; }
.logo { width: 32px; height: 32px; }
.place { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 16px; border: 0; background: none; cursor: pointer; border-left: 1px solid var(--line); padding: 6px 8px 6px 18px; }
.place small { font-weight: 500; color: var(--soft); font-size: 13px; }
.place:hover small { color: var(--ink); }
.tabs { display: flex; height: 100%; margin-left: 18px; border-left: 1px solid var(--line); padding-left: 18px; gap: 4px; }
.tabs button { border: 0; background: none; padding: 0 12px; height: 100%; color: var(--soft); font-weight: 500; font-size: 14px; cursor: pointer; border-bottom: 3px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--space); }
.tabs button:disabled { cursor: default; opacity: .55; }
.grow { flex: 1; }
.meta { color: var(--soft); font-variant-numeric: tabular-nums; }
.hbtn { width: 36px; height: 36px; border: 0; background: none; border-radius: 10px; display: grid; place-items: center; cursor: pointer; color: var(--ink); }
.hbtn:hover { background: #f1f3f7; }
.avatar { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-weight: 600; font-size: 13px; }
.menu { position: absolute; top: 50px; left: 66px; background: #fff; border-radius: 12px; box-shadow: var(--shadow); padding: 6px; z-index: 40; min-width: 220px; }
.menu button { display: flex; width: 100%; border: 0; background: none; padding: 9px 12px; border-radius: 8px; cursor: pointer; text-align: left; justify-content: space-between; }
.menu button:hover { background: #f3f5f9; }
.menu button[aria-checked="true"]::after { content: "✓"; color: var(--space); font-weight: 700; }

/* ---- stage ---- */
.stage { position: relative; flex: 1; min-height: 0; overflow: hidden; cursor: grab; outline: none; background: #111; }
.stage.dragging { cursor: grabbing; }
#gl, #ov { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.glass { background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: var(--shadow); }

/* left tool rail */
.rail { position: absolute; left: 16px; top: 54px; border-radius: 16px; padding: 8px 6px; display: flex; flex-direction: column; gap: 4px; z-index: 10; }
.rail button { width: 40px; height: 40px; border: 0; background: none; border-radius: 10px; display: grid; place-items: center; cursor: pointer; color: #2a3142; position: relative; }
.rail button:hover, .rail button[aria-pressed="true"] { background: #eef2fb; color: var(--space); }
.rail button[data-tip]:hover::after { content: attr(data-tip); position: absolute; left: 48px; white-space: nowrap; background: var(--ink); color: #fff; font-size: 12px; padding: 4px 8px; border-radius: 6px; }

/* category chips */
.chips { position: absolute; right: 16px; top: 22px; border-radius: 999px; padding: 6px; display: flex; gap: 4px; z-index: 10; }
.chip { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 5px 8px 5px 5px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 14px; }
.chip .ic { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; }
.chip .n { min-width: 26px; height: 22px; border-radius: 999px; background: #eef0f4; display: grid; place-items: center; font-size: 12px; font-variant-numeric: tabular-nums; padding: 0 6px; }
.chip[aria-pressed="false"] { opacity: .45; }
.chip[data-k="person"] .ic { background: #fff3c4; color: #b88a00; } .chip[data-k="object"] .ic { background: #ffe1e6; color: var(--object); }
.chip[data-k="space"] .ic { background: #e2ecff; color: var(--space); }
.chip[data-k="object"] .lbl { color: var(--object); } .chip[data-k="space"] .lbl { color: var(--space); }

/* ---- info windows (dark, colour-coded border; positioned every frame, leader lines on the overlay canvas) ---- */
.card { position: absolute; left: 0; top: 0; border-radius: 14px; background: var(--win); color: #fff; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        border: 2px solid; box-shadow: 0 10px 28px rgba(0,0,0,.35); z-index: 8; will-change: transform; }
.card.person { border-color: var(--person); } .card.object { border-color: var(--object); } .card.space { border-color: var(--space); }
.card .r { display: flex; align-items: center; gap: 12px; padding: 3px 0; font-size: 14px; white-space: nowrap; }
.card .r .k { min-width: 40px; display: flex; justify-content: center; flex: none; color: #e9ecf2; }
.card .r .v { overflow: hidden; text-overflow: ellipsis; }
.card .r .v.soft { color: var(--win-soft); }
.card .r + .r { border-top: 1px solid rgba(255,255,255,.08); }
.badge { font: 700 13px var(--sans); padding: 3px 7px; border-radius: 6px; min-width: 34px; text-align: center; }
.person .badge { background: var(--person); color: #1a1a1a; } .object .badge { background: var(--object); color: #fff; } .space .badge { background: var(--space); color: #fff; }
.card.compact { padding: 8px 14px 8px 10px; min-width: 200px; max-width: 260px; cursor: pointer; }
.card.compact:hover { box-shadow: 0 12px 34px rgba(0,0,0,.5); }
.card.full { width: 300px; padding: 10px 12px 12px; }
.card.full .hd { display: flex; align-items: center; gap: 10px; padding-bottom: 8px; font-weight: 600; font-size: 14.5px; }
.card.full .hd button { margin-left: auto; border: 0; background: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; cursor: pointer; color: var(--win-soft); }
.card.full .hd button + button { margin-left: 0; }
.card.full .hd button:hover { background: rgba(255,255,255,.1); color: #fff; }
.who { display: flex; gap: 12px; align-items: center; padding: 8px 0 10px; border-top: 1px solid rgba(255,255,255,.1); }
.who canvas { width: 64px; height: 64px; border-radius: 10px; background: #2a2f3a; flex: none; }
.who b { display: block; font-size: 15px; }
.who small { color: var(--win-soft); font-size: 12.5px; }
.card.full .rows { border-top: 1px solid rgba(255,255,255,.1); padding-top: 4px; }
.card.full .r small { display: block; color: var(--win-soft); font-size: 11px; }
.conf { display: flex; align-items: center; gap: 10px; padding-top: 10px; font-size: 12.5px; color: var(--win-soft); }
.conf .meter { flex: 1; height: 6px; border-radius: 999px; background: rgba(255,255,255,.14); overflow: hidden; }
.conf .meter i { display: block; height: 100%; border-radius: 999px; }
.person .conf .meter i { background: var(--person); } .object .conf .meter i { background: var(--object); } .space .conf .meter i { background: var(--space); }
.conf b { color: #fff; font-variant-numeric: tabular-nums; }
.note { color: var(--win-soft); font-size: 11px; padding-top: 8px; }
.signtext { font-size: 17px; font-weight: 600; padding: 8px 0; border-top: 1px solid rgba(255,255,255,.1); unicode-bidi: plaintext; direction: auto; }

/* ---- round mini map (Lens look) ---- */
.mini { position: absolute; right: 18px; bottom: 130px; width: 230px; height: 230px; border-radius: 50%; overflow: hidden; border: 4px solid #fff; box-shadow: var(--shadow); background: #e5e9ee; z-index: 9; }
.mini #mm { position: absolute; inset: 0; background: #e5e9ee; }
.soft-tiles { filter: grayscale(.8) brightness(1.05); }
.mini .n { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); z-index: 500; font: 800 13px var(--sans); color: var(--ink); background: rgba(255,255,255,.95); border-radius: 999px; width: 26px; height: 26px; display: grid; place-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.15); pointer-events: none; }
.mini .you svg { width: 60px; height: 60px; overflow: visible; }
.mini .mm-layer { position: absolute; left: 0; top: 0; pointer-events: none; }
.mini-cap { white-space: pre-line; position: absolute; right: 8px; bottom: 86px; width: 250px; text-align: center; color: #fff; font-size: 11px; line-height: 1.35; text-shadow: 0 1px 3px rgba(0,0,0,.9); pointer-events: none; z-index: 9; }

/* ---- bottom transport ---- */
.transport { position: absolute; left: 50%; transform: translateX(-50%); bottom: 18px; width: min(1340px, calc(100% - 40px)); height: 60px; border-radius: 999px; display: flex; align-items: center; gap: 14px; padding: 0 22px 0 10px; z-index: 10; }
.play { width: 42px; height: 42px; border-radius: 50%; border: 0; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.15); display: grid; place-items: center; cursor: pointer; flex: none; }
.time { font-variant-numeric: tabular-nums; min-width: 92px; color: var(--soft); }
.time b { color: var(--ink); font-weight: 600; }
.track { flex: 1; position: relative; height: 36px; cursor: pointer; }
.track .rail-line { position: absolute; left: 0; right: 0; top: 17px; height: 2px; background: #d9dce4; border-radius: 2px; }
.track .done { position: absolute; left: 0; top: 17px; height: 2px; background: #9aa3b5; border-radius: 2px; }
.track .ticks { position: absolute; left: 0; right: 0; top: 22px; height: 6px; background: repeating-linear-gradient(90deg, #d9dce4 0 1px, transparent 1px 1.25%); }
.track .mk { position: absolute; top: 12px; width: 10px; height: 10px; margin-left: -5px; border: 0; padding: 0; cursor: pointer; }
.track .mk.person { background: var(--person); border-radius: 50%; }
.track .mk.object { background: var(--object); border-radius: 1px; top: 4px; }
.track .mk.space { background: var(--space); border-radius: 0; width: 12px; height: 11px; margin-left: -6px; top: 11px; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.track .mk.bookmark { background: #fff; border: 2px solid var(--ink); top: 3px; width: 11px; height: 11px; }
.track .mk:hover { transform: scale(1.35); }
.track .thumb { position: absolute; top: 9px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; background: #fff; border: 2px solid #c6cbd6; box-shadow: 0 1px 4px rgba(0,0,0,.2); pointer-events: none; }
.track .tip { position: absolute; bottom: 34px; transform: translateX(-50%); background: var(--ink); color: #fff; font-size: 11.5px; padding: 3px 8px; border-radius: 6px; white-space: nowrap; pointer-events: none; }
.tbtn { height: 38px; min-width: 38px; border: 0; background: none; border-radius: 10px; display: grid; place-items: center; cursor: pointer; font-weight: 600; font-variant-numeric: tabular-nums; }
.tbtn:hover, .tbtn[aria-pressed="true"] { background: #eef1f6; }
.tbtn:disabled { opacity: .35; cursor: default; }
.sep { width: 1px; height: 26px; background: var(--line); }

/* ---- popovers ---- */
.pop { position: absolute; left: 70px; top: 54px; width: 290px; border-radius: 16px; padding: 14px 16px; z-index: 30; }
.pop h4 { margin: 0 0 10px; font-size: 14px; }
.pop label { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.pop label:last-of-type { border-bottom: 0; }
.pop label span { flex: 1; }
.pop input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--space); }
.pop .row { padding-top: 10px; color: var(--soft); font-size: 12.5px; }
.pop input[type=range] { width: 100%; accent-color: var(--space); }
.pop input[type=text] { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; font: inherit; }
.pop .hint { color: var(--soft); font-size: 12px; padding-top: 8px; }
#statsNote { font-size: 13px; text-align: center; }
/* statistics panel: People / Objects / Places, donuts that follow the walk + a trend along the whole walk */
.pop.stats { width: 380px; max-height: calc(100% - 150px); overflow: auto; padding: 16px 18px; }
.seg { display: flex; background: #eef0f4; border-radius: 999px; padding: 3px; margin-bottom: 10px; }
.seg button { flex: 1; border: 0; background: none; border-radius: 999px; padding: 8px 4px; font-weight: 600; font-size: 14.5px; color: var(--soft); cursor: pointer; display: flex; gap: 6px; align-items: center; justify-content: center; }
.seg button[aria-selected="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.donut { display: block; width: 100%; height: auto; overflow: visible; }
.donut .ctr { font: 700 40px var(--sans); fill: var(--ink); font-variant-numeric: tabular-nums; }
.donut .ctr2 { font: 500 14px var(--sans); fill: var(--soft); }
.donut .lb { font: 700 17px var(--sans); fill: var(--ink); font-variant-numeric: tabular-nums; }
.donut .lb tspan.n { font-weight: 700; }
.donut .lb tspan.k { fill: #52514e; font-weight: 500; }
.donut path { cursor: default; transition: opacity .15s; }
.donut path:hover { opacity: .8; }
.dt { font-weight: 700; font-size: 16px; margin: 8px 0 0; display: flex; justify-content: space-between; align-items: baseline; }
.dt small { font-weight: 500; font-size: 13px; color: var(--soft); }
.leg { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; font-size: 15px; color: #3b3a37; margin: 4px 0 14px; }
.leg i { display: inline-block; width: 13px; height: 13px; border-radius: 3px; margin-right: 7px; vertical-align: -1px; }
.trend { position: relative; border-top: 1px solid var(--line); padding-top: 8px; margin-top: 4px; }
.trend .tlbl { font-size: 13.5px; color: var(--soft); margin-bottom: 6px; }
.trend svg { width: 100%; height: 64px; display: block; cursor: crosshair; }
.tip2 { position: absolute; top: 0; transform: translateX(-50%); background: var(--ink); color: #fff; font-size: 13px; padding: 2px 7px; border-radius: 6px; white-space: nowrap; pointer-events: none; }
.signs { font-size: 15px; margin: 0 0 8px; }
.signs div { padding: 4px 0; border-bottom: 1px solid var(--line); unicode-bidi: plaintext; direction: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nums summary { cursor: pointer; font-size: 13.5px; color: var(--soft); padding-top: 10px; }
.stats .grid { display: grid; grid-template-columns: 1fr auto; gap: 5px 12px; font-size: 14.5px; padding-top: 8px; }
.stats .grid span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.dtip { position: fixed; background: var(--ink); color: #fff; font-size: 13.5px; padding: 3px 8px; border-radius: 6px; pointer-events: none; z-index: 60; white-space: nowrap; }
.toast { position: absolute; left: 50%; top: 22px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 999px; font-size: 12.5px; z-index: 50; pointer-events: none; transition: opacity .4s; }
</style>
</head>
<body>
<header>
  <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 28 9v14l-12 7L4 23V9z" fill="#2f7cf6"/><path d="M16 2 28 9l-12 7L4 9z" fill="#7fb0ff"/><path d="M16 16v14l12-7V9z" fill="#1d5fd0"/><path d="M16 9.5 22 13v6l-6 3.5L10 19v-6z" fill="#fff" opacity=".9"/></svg>
  <button class="place" id="placeBtn" aria-haspopup="menu" aria-expanded="false">Shuk HaTikvah <small id="walkName">· Hatikvah St</small>
    <svg width="16" height="16" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true">360° Exploration</button>
    <button role="tab" aria-selected="false" disabled title="Coming in a later version">Observations</button>
    <button role="tab" aria-selected="false" disabled title="Coming in a later version">Analysis</button>
  </nav>
  <div class="grow"></div>
  <div class="meta" title="Recording date">Aug 25, 2025</div>
  <button class="hbtn" id="fsTop" aria-label="Full screen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button class="hbtn" id="setBtn" aria-label="Settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button>
  <div class="avatar" title="Alex Alvisi">AA</div>
</header>
<div class="menu" id="walkMenu" role="menu" hidden>
  <button role="menuitemradio" data-walk="walk1" aria-checked="true">Walk 1 · Hatikvah St</button>
  <button role="menuitemradio" data-walk="walk2" aria-checked="false">Walk 2 · Hamevasser St</button>
</div>

<div class="stage" id="stage" aria-label="360 degree view. Follows the walking direction; drag to look around, scroll to zoom, click a dot for details.">
  <canvas id="gl"></canvas><canvas id="ov"></canvas>
  <div id="cards"></div>

  <div class="rail glass" data-no-drag>
    <button id="tCenter" data-tip="Follow the walking direction" aria-label="Follow the walking direction" aria-pressed="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
    <button id="tSearch" data-tip="Find a person by ID" aria-label="Find"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg></button>
    <button id="tStats" data-tip="Statistics" aria-label="Statistics"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h16M7 17v-6M12 17V6M17 17v-9"/></svg></button>
    <button id="tMark" data-tip="Bookmark this moment" aria-label="Bookmark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg></button>
    <button id="tLayers" data-tip="Layers & filters" aria-label="Layers"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/><path d="m3 17.5 9 5 9-5" opacity=".6"/></svg></button>
  </div>

  <div class="chips glass" data-no-drag>
    <button class="chip" data-k="person" aria-pressed="true"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5" fill="var(--person)" stroke="#fff" stroke-width="2"/></svg></span><span class="lbl">People</span><span class="n" id="nP">0</span></button>
    <button class="chip" data-k="object" aria-pressed="true"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" fill="var(--object)" stroke="#fff" stroke-width="2"/></svg></span><span class="lbl">Objects</span><span class="n" id="nO">0</span></button>
    <button class="chip" data-k="space" aria-pressed="true"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 3.5 21 19.5H3z" fill="var(--space)" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg></span><span class="lbl">Places</span><span class="n" id="nS">0</span></button>
  </div>

  <div class="mini" data-no-drag aria-label="Map: your position on the walk"><div id="mm"></div><span class="n">N</span></div>
  <div class="mini-cap" id="mmCap"></div>

  <div class="transport glass" data-no-drag>
    <button class="play" id="play" aria-label="Play"><svg id="playIc" width="18" height="18" viewBox="0 0 24 24"><path d="M7 4v16l13-8z" fill="currentColor"/></svg></button>
    <div class="time"><b id="tNow">00:00</b> / <span id="tDur">00:00</span></div>
    <div class="track" id="track" aria-label="Timeline"><div class="rail-line"></div><div class="done" id="done"></div><div class="ticks"></div><div id="marks"></div><div class="thumb" id="thumb"></div><div class="tip" id="tip" hidden></div></div>
    <button class="tbtn" id="spin" aria-pressed="false" title="Auto-rotate the 360° view" aria-label="Auto-rotate"><svg width="26" height="26" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6"><ellipse cx="16" cy="16" rx="12" ry="5"/><path d="M8 9.5A12 12 0 0 1 24 9.5M24 22.5A12 12 0 0 1 8 22.5"/><text x="16" y="18.5" font-size="7" text-anchor="middle" fill="currentColor" stroke="none" font-family="Inter" font-weight="700">360°</text></svg></button>
    <button class="tbtn" disabled title="VR headset view: later version" aria-label="VR (later)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8h18v9h-6l-1.5-2.5h-3L9 17H3z"/><circle cx="8" cy="12" r="1.6"/><circle cx="16" cy="12" r="1.6"/></svg></button>
    <div class="sep"></div>
    <button class="tbtn" id="speed" title="Playback speed">1.0x</button>
    <div class="sep"></div>

  </div>

  <div class="pop glass" id="layersPop" data-no-drag hidden>

      <button role="tab" data-tab="space" aria-selected="false"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 1 11.5 11H.5z" fill="var(--space)"/></svg>Places</button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="engine.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const COL = { person: css("--person"), object: css("--object"), space: css("--space") };
  const E = ShukEngine.create({ gl: $("gl"), overlay: $("ov"), host: $("stage") });
  const stage = $("stage"), D2R = Math.PI / 180;
  const show = { person: true, object: true, decor: false, space: true, labels: true, trails: true };
  const DECOR = new Set(["hanging lamp", "flag", "awning"]);
  const CARRY = new Set(["handbag", "backpack", "suitcase", "umbrella", "plastic bag", "wheeled shopping trolley", "trolley cart", "hand truck"]);
  const pinned = [];                 // [{kind, id}] expanded cards, newest last (max 3)
  let auto = [], autoAt = 0, hover = null;
  const wrap = a => ((a + 540) % 360) - 180;

  const groupOf = e => e.kind === "person" ? "person" : (e.kind === "object" || e.kind === "level2") ? (DECOR.has(e.cls) ? (show.decor ? "object" : null) : "object")
    : (e.kind === "sign" && e.readable) ? "space" : null;
  const keyOf = e => `${e.kind}:${e.id}`;
  const cap = s => String(s || "").replace(/^./, c => c.toUpperCase());
  const esc = t => String(t ?? "").replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
  const pad2 = n => String(n).padStart(2, "0");
  const fmt = s => `${pad2(Math.floor(s / 60))}:${pad2(Math.floor(s % 60))}`;

  // ---- walking direction (pipeline/forward_dir.py -> forward.json): the view follows it until the user drags ----
  let FW = null, follow = true;
  const fwdAt = fi => FW ? FW.fwd_deg[Math.max(0, Math.min(FW.fwd_deg.length - 1, fi))] : 0;
  const setFollow = on => { follow = on; $("tCenter").setAttribute("aria-pressed", String(on)); };
  stage.addEventListener("pointermove", ev => { if (ev.buttons && !ev.target.closest("[data-no-drag]")) setFollow(false); });
  stage.addEventListener("keydown", ev => { if (ev.key.startsWith("Arrow")) setFollow(false); });

  // ---- camera path + ground positions of people (dead reckoning along the walking direction at the walk pace) ----
  // world frame = stabilised view-yaw frame (x = yaw 90, y = yaw 0), metres; good for speeds and short trails
  let CAM = null, PP = null;
  function buildMotion(d) {
    const n = d.n_frames, v = d.pace_m_s || 0.9, dt = 1 / d.fps; CAM = new Float32Array(n * 2); PP = new Map();
    let x = 0, y = 0;
    for (let f = 0; f < n; f++) {
      if (f > 0 && FW && FW.moving[Math.min(f, FW.moving.length - 1)]) { const a = fwdAt(f) * D2R; x += v * dt * Math.sin(a); y += v * dt * Math.cos(a); }
      CAM[2 * f] = x; CAM[2 * f + 1] = y;
      for (const e of d.frames[f].p) if (e[7]) {
        let m = PP.get(e[0]); if (!m) PP.set(e[0], m = new Map());
        m.set(f, [x + e[7] * Math.sin(e[2] * D2R), y + e[7] * Math.cos(e[2] * D2R)]);
      }
    }
  }
  const camAt = f => CAM ? [CAM[2 * f], CAM[2 * f + 1]] : [0, 0];      // CAM is built once forward.json has loaded
  // speed + direction relative to the camera, from ground positions ~1.6 s before and after
  function motionOf(id, fi) {
    const m = PP && PP.get(id); if (!m) return null;
    let k0 = null, k1 = null;
    for (let k = fi - 8; k <= fi - 3; k++) if (m.has(k)) { k0 = k; break; }
    for (let k = fi + 8; k >= fi; k--) if (m.has(k)) { k1 = k; break; }
    if (k0 == null || k1 == null || k1 - k0 < 4) return null;
    const p0 = m.get(k0), p1 = m.get(k1), dt = (k1 - k0) / E.data.fps, vx = (p1[0] - p0[0]) / dt, vy = (p1[1] - p0[1]) / dt, spd = Math.hypot(vx, vy);
    const p = m.get(fi) || p1, c = camAt(fi), tx = c[0] - p[0], ty = c[1] - p[1], cosT = (vx * tx + vy * ty) / (spd * Math.hypot(tx, ty) || 1);
    let dir;
    if (spd < 0.35) dir = "Standing";
    else if (cosT > 0.55) dir = "Toward camera";
    else if (cosT < -0.55) dir = "Away from camera";
    else { const side = vx * Math.cos(E.yaw * D2R) - vy * Math.sin(E.yaw * D2R); dir = side > 0 ? "Crossing →" : "Crossing ←"; }
    return { spd, dir };
  }

  // older overlay files store signs without the conf column the engine expects: insert it once after loading
  const J = async u => { const r = await fetch(u); if (!r.ok) throw new Error(u); return r.json(); };
  const load = async w => {
    const d = await E.load(w);
    if (d.fields && d.fields.s && d.fields.s[1] !== "conf") { for (const F of d.frames) for (const s of F.s || []) s.splice(1, 0, 1); d.fields.s.splice(1, 0, "conf"); }
    try { FW = await J(`../data/processed/${w}/forward.json`); } catch (e) { FW = null; }
    buildMotion(d); buildMarks(d); buildTrends(d); buildMet(d, await geoFor(w)); mapRoute(); setFollow(true); E.look(fwdAt(0), -5); E.fov = 90;
    return d;
  };

  // ---- legend shapes (video pointers, map, chips): people = yellow circle, objects = red square, places = blue triangle ----
  function mark(c, g, x, y, r, lw) {
    c.beginPath();
    if (g === "person") c.arc(x, y, r, 0, 7);
    else if (g === "object") c.rect(x - r * .9, y - r * .9, r * 1.8, r * 1.8);
    else { c.moveTo(x, y - r * 1.25); c.lineTo(x + r * 1.15, y + r * .8); c.lineTo(x - r * 1.15, y + r * .8); c.closePath(); }
    c.fillStyle = COL[g]; c.fill(); c.lineWidth = lw; c.strokeStyle = "#fff"; c.lineJoin = "round"; c.stroke();
  }

  // ---- pointer anchor: upper torso for people, centre for objects and signs ----
  const anchor = e => { const r = e.rect; return e.kind === "person" ? [(r[0] + r[2]) / 2, r[1] + (r[3] - r[1]) * 0.22] : [(r[0] + r[2]) / 2, (r[1] + r[3]) / 2]; };

  // ---- perceived description of a person ----
  const AGE = { "child": ["Child", "under 18"], "young adult 18-35": ["Young adult", "~18–35 years"], "middle adult 36-60": ["Adult", "~36–60 years"],
                "older adult 61+": ["Older adult", "61+ years"], "uncertain": ["Person", "age uncertain"] };
  const SEX = { man: "male", woman: "female" };
  function personTitle(e) {
    const [a, yrs] = AGE[e.age] || AGE.uncertain, s = SEX[e.sex];
    return [e.age === "child" ? "Child" : s ? (a === "Person" ? cap(s) : `${a} ${s}`) : a, yrs];
  }
  function nearby(e, st) {
    const F = st.data.frames[st.fi]; if (!F || !e.dist) return null;
    const P = (yw, d) => [d * Math.sin(yw * D2R), d * Math.cos(yw * D2R)], me = P(e.yaw, e.dist);
    let n = 0; for (const o of F.p) { if (o[0] === e.id || o[7] == null) continue; const q = P(o[2], o[7]); if (Math.hypot(q[0] - me[0], q[1] - me[1]) < 1.5) n++; }
    return n;
  }
  function carrying(e, st) {
    const r = e.rect, items = new Set();
    for (const o of st.entities) if ((o.kind === "object" || o.kind === "level2") && CARRY.has(o.cls)) {
      const [x, y] = anchor(o); if (x > r[0] && x < r[2] && y > r[1] + (r[3] - r[1]) * 0.25 && y < r[3] + (r[3] - r[1]) * 0.1) items.add(o.cls);
    }
    return [...items];
  }

  // ---- photo crop of an entity straight from the equirect video frame ----
  function rawOf(e, st) { const F = st.data.frames[st.fi]; if (!F) return null; const ii = { p: 0, o: 7, l2: 8, s: 0 }[e.key]; return (F[e.key] || []).find(x => x[ii] === e.id) || null; }
  function crop(cv, e, st) {
    const v = E.video, raw = rawOf(e, st); if (!raw || v.readyState < 2 || !v.videoWidth) return false;
    const W = v.videoWidth, H = v.videoHeight, u = y => (y / 360 + 0.5) * W, w = p => (0.5 - p / 180) * H;
    let x0 = u(raw[3]), x1 = u(raw[4]); if (x1 < x0) x1 += W;
    const y0 = w(raw[5]), y1 = w(raw[6]), bw = x1 - x0, bh = y1 - y0, cx = (x0 + x1) / 2;
    let side, top;
    if (e.kind === "person") { side = Math.max(bw * 1.05, bh * 0.42); top = y0 - side * 0.04; } else { side = Math.max(bw, bh) * 1.25; top = (y0 + y1) / 2 - side / 2; }
    side = Math.max(side, 24); top = Math.max(0, Math.min(H - side, top));
    const c = cv.getContext("2d"); c.fillStyle = "#2a2f3a"; c.fillRect(0, 0, cv.width, cv.height);
    c.drawImage(v, Math.max(0, Math.min(W - side, cx - side / 2)), top, side, side, 0, 0, cv.width, cv.height);
    return true;
  }

  // ---- icons (white line icons for the dark windows) ----
  const IC = {
    walk: `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="13" cy="4" r="2.2"/><path d="M10.2 7.6 7 9.6V13h2v-2.3l1.4-.8L9 21h2.2l1.2-5.5 2.1 2V21h2v-5l-2.2-2.2.6-3.1A6 6 0 0 0 19 13v-2a4 4 0 0 1-3.4-2l-1-1.6a2 2 0 0 0-2.5-.8z"/></svg>`,
    eye: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>`,
    clock: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>`,
    ruler: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12h16M4 9v6M20 9v6"/></svg>`,
    bag: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 8h14l-1 13H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>`,
    group: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.2A5 5 0 0 1 21 19"/></svg>`,
    tag: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.4"/></svg>`,
    lang: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h9M8.5 3v2M6 5c1 4 4 7 7 8M11 5c-1 4-4 7-7 8M13 21l4-10 4 10M14.5 17.5h5"/></svg>`,
    focus: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4h6v6M20 4l-8 8M10 4H4v16h16v-6"/></svg>`,
    close: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>`,
  };
  const R = (k, v, soft) => `<div class="r"><div class="k">${k}</div><div class="v${soft ? " soft" : ""}">${v}</div></div>`;
  const R2 = (k, lbl, v) => `<div class="r"><div class="k">${k}</div><div class="v"><small>${lbl}</small>${v}</div></div>`;
  const confRow = v => `<div class="conf">Confidence <div class="meter"><i style="width:${Math.round(v * 100)}%"></i></div><b>${Math.round(v * 100)}%</b></div>`;
  const KIND_TXT = { object: "Object", level2: "Market item" };
  const visibleS = (e, st) => { const t = st.data.tracks[e.id]; return t ? Math.max(0, (st.fi - t[0]) / st.data.fps) : null; };
  const objVisibleS = (e, st) => ((st.data.obj_len || {})[e.id] || 0) / st.data.fps;
  const badgeOf = (e, g) => g === "person" ? `P${e.id}` : g === "space" ? `S${e.id}` : `O${e.id % 100000}`;

  function compactHtml(e, g, st) {
    if (g === "person") {
      const m = motionOf(e.id, st.fi), vis = visibleS(e, st);
      return R(`<span class="badge">${badgeOf(e, g)}</span>`, m ? `≈${m.spd.toFixed(1)} m/s` : (e.dist ? `${e.dist.toFixed(1)} m away` : "—")) +
        R(IC.walk, vis != null ? `${vis.toFixed(1)} s (visible)` : "—", true) + R(IC.eye, m ? m.dir : "Direction unknown");
    }
    if (g === "space") return R(`<span class="badge">${badgeOf(e, g)}</span>`, `<span dir="auto" style="unicode-bidi:plaintext">${esc(e.text)}</span>`) + R(IC.tag, "Readable sign", true);
    return R(`<span class="badge">${badgeOf(e, g)}</span>`, `${ShukEngine.emojiOf(e.cls)} ${esc(cap(e.cls))}`) + R(IC.clock, `${objVisibleS(e, st).toFixed(1)} s (visible)`, true) +
      R(IC.eye, `${Math.round(e.conf * 100)}% confidence`);
  }
  function fullHtml(e, g, st) {
    const d = st.data, hd = (title) => `<div class="hd"><span class="badge">${badgeOf(e, g)}</span>${title}<button data-act="focus" aria-label="Look at it" title="Look at it">${IC.focus}</button><button data-act="close" aria-label="Close" title="Close">${IC.close}</button></div>`;
    if (g === "person") {
      const t = d.tracks[e.id] || [], [title, yrs] = personTitle(e), n = nearby(e, st), carry = carrying(e, st), m = motionOf(e.id, st.fi), vis = visibleS(e, st);
      const social = n == null ? "—" : n === 0 ? "Alone (no group detected)" : `With ${n} other${n > 1 ? "s" : ""} within 1.5 m`;
      return hd("Person") + `<div class="who"><canvas width="128" height="128" data-photo></canvas><div><b>${esc(title)}</b><small>${esc(yrs)} · perceived</small></div></div>` +
        `<div class="rows">${R2(IC.walk, "Movement", m ? (m.dir === "Standing" ? "Standing" : `≈${m.spd.toFixed(1)} m/s · ${m.dir}`) : "—")}` +
        `${R2(IC.clock, "Visible", vis != null ? `${vis.toFixed(1)} s so far · ${Math.round((t[1] - t[0]) / d.fps)} s in total` : "—")}` +
        `${R2(IC.ruler, "Distance", e.dist ? `${e.dist.toFixed(1)} m from camera` : "—")}${R2(IC.bag, "Carrying", carry.length ? esc(carry.map(cap).join(", ")) : "Nothing detected")}` +
        `${R2(IC.group, "Social context", social)}</div>${confRow(t[3] ?? e.conf)}<div class="note">Estimates from video, not identity. Speeds assume the camera walks at ${d.pace_m_s || 0.9} m/s.</div>`;
    }
    if (g === "space") {
      const info = (d.signs || {})[e.id] || [];
      return hd("Sign") + `<div class="signtext" dir="auto">${esc(e.text)}</div><div class="rows">${R2(IC.lang, "Language", { he: "Hebrew", en: "English", ar: "Arabic" }[info[1]] || esc(info[1] || "—"))}</div>` +
        `${confRow(Math.min(1, (info[2] || 0) / 100))}<div class="note">Read with OCR (Tesseract).</div>`;
    }
    return hd(KIND_TXT[e.kind]) + `<div class="who"><canvas width="128" height="128" data-photo></canvas><div><b>${ShukEngine.emojiOf(e.cls)} ${esc(cap(e.cls))}</b><small>${e.kind === "level2" ? "Market item (open-vocabulary)" : "Everyday object"}</small></div></div>` +
      `<div class="rows">${R2(IC.tag, "Category", e.kind === "level2" ? "Market infrastructure" : "Object / vehicle")}${R2(IC.clock, "Visible", `${objVisibleS(e, st).toFixed(0)} s on this walk`)}</div>${confRow(e.conf)}`;
  }

  // ---- card pool: create/update/position DOM cards; leader lines go on the canvas ----
  const pool = new Map();
  function cardFor(key) {
    let c = pool.get(key);
    if (!c) {
      c = { el: document.createElement("div"), sig: "", photoAt: 0 }; c.el.setAttribute("data-no-drag", "");
      c.el.addEventListener("pointerdown", ev => ev.stopPropagation());
      c.el.addEventListener("click", ev => onCardClick(key, ev)); $("cards").appendChild(c.el); pool.set(key, c);
    }
    return c;
  }
  const isPinned = key => pinned.some(p => `${p.kind}:${p.id}` === key);
  function onCardClick(key, ev) {
    const act = ev.target.closest("[data-act]"), [kind, id] = key.split(":"), e = (E.state?.entities || []).find(x => keyOf(x) === key);
    if (act && act.dataset.act === "close") { unpin(key); return; }
    if (act && act.dataset.act === "focus") { if (e) { setFollow(false); E.look(e.yaw, (e.pt + e.pb) / 2); } return; }
    if (!isPinned(key)) pin({ kind, id: +id });
  }
  function pin(p) { unpin(`${p.kind}:${p.id}`); pinned.push(p); while (pinned.length > 3) pinned.shift(); }
  function unpin(key) { const i = pinned.findIndex(p => `${p.kind}:${p.id}` === key); if (i >= 0) pinned.splice(i, 1); }

  const overlap = (a, b) => a[0] < b[2] && a[2] > b[0] && a[1] < b[3] && a[3] > b[1];
  function layoutCards(st, c, list) {
    const k = E.k, Wc = stage.clientWidth, Hc = stage.clientHeight;
    const blocked = [[0, 0, 70, 330], [Wc - 520, 0, Wc, 74], [Wc - 270, Hc - 400, Wc, Hc], [0, Hc - 92, Wc, Hc]];
    const placed = [], used = new Set();
    for (const it of list) {
      const { e, g, full } = it, key = keyOf(e), card = cardFor(key); used.add(key);
      card.el.className = `card ${g} ${full ? "full" : "compact"}`;
      const sig = `${full}|${e.age}|${e.sex}|${e.text || ""}|${Math.floor(st.t * 2)}`;
      if (card.sig !== sig) {
        const keep = card.el.querySelector("[data-photo]"); card.el.innerHTML = full ? fullHtml(e, g, st) : compactHtml(e, g, st); card.sig = sig;
        const ph = card.el.querySelector("[data-photo]"); if (ph && keep && keep.dataset.ok) { ph.getContext("2d").drawImage(keep, 0, 0); ph.dataset.ok = 1; }
      }
      const ph = card.el.querySelector("[data-photo]");
      if (ph && (!ph.dataset.ok || performance.now() - card.photoAt > 1500)) { if (crop(ph, e, st)) { ph.dataset.ok = 1; card.photoAt = performance.now(); } }
      const w = card.el.offsetWidth, h = card.el.offsetHeight, [ax, ay] = anchor(e).map(v => v / k), right = ax < Wc * 0.55;
      const cands = (right ? [[36, -h - 26], [36, 26], [-w - 36, -h - 26], [-w - 36, 26], [56, -h / 2]] : [[-w - 36, -h - 26], [-w - 36, 26], [36, -h - 26], [36, 26], [-w - 56, -h / 2]])
        .map(([dx, dy]) => { const x = Math.max(76, Math.min(Wc - w - 12, ax + dx)), y = Math.max(12, Math.min(Hc - h - 96, ay + dy)); return [x, y, x + w, y + h]; });
      const score = r => placed.filter(p => overlap(p, r)).length * 10 + blocked.filter(b => overlap(b, r)).length * 3;

  function buildMarks(d) {
    const ppl = d.frames.map(F => F.p.filter(x => x[1] >= E.conf).length);
    const obj = d.frames.map(F => F.l2.filter(x => !DECOR.has(x[0]) && x[1] >= .3).length + F.o.filter(x => x[1] >= E.conf).length);
    const firstSign = new Map(); d.frames.forEach((F, i) => { for (const s of F.s || []) if ((d.signs[s[0]] || [])[3] && !firstSign.has(s[0])) firstSign.set(s[0], i); });
    const signs = [...firstSign.values()].sort((a, b) => a - b).filter((f, i, a) => i === 0 || f - a[i - 1] > d.fps * 8).slice(0, 10);
    marks = [...peaks(ppl, 8, d.fps * 12).map(f => ({ f, k: "person", t: `Crowd peak · ${ppl[f]} people` })),
             ...peaks(obj, 4, d.fps * 20).map(f => ({ f, k: "object", t: `Busy stalls · ${obj[f]} items` })),
             ...signs.map(f => ({ f, k: "space", t: "Readable sign" }))];
    renderMarks();
  }
  function renderMarks() {
    const d = E.data; if (!d) return;
    const all = [...marks, ...bookmarks[E.walk].map(f => ({ f, k: "bookmark", t: "Bookmark" }))];
    $("marks").innerHTML = all.map(m => `<button class="mk ${m.k}" style="left:${m.f / d.n_frames * 100}%" data-f="${m.f}" data-t="${esc(m.t)} · ${fmt(m.f / d.fps)}" aria-label="${esc(m.t)}"></button>`).join("");
  }

  // ---- transport ----
  const track = $("track");
  const tOf = ev => { const r = track.getBoundingClientRect(); return Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)) * E.duration(); };
  let scrub = false;
  track.addEventListener("pointerdown", ev => { const mk = ev.target.closest(".mk"); if (mk) { E.seekFrame(+mk.dataset.f); return; } scrub = true; track.setPointerCapture(ev.pointerId); E.seek(tOf(ev)); });
  track.addEventListener("pointermove", ev => {
    if (scrub) E.seek(tOf(ev));
    const mk = ev.target.closest(".mk"), tip = $("tip"), r = track.getBoundingClientRect();
    tip.hidden = false; tip.style.left = `${ev.clientX - r.left}px`; tip.textContent = mk ? mk.dataset.t : fmt(tOf(ev));
  });
  track.addEventListener("pointerup", () => { scrub = false; });
  track.addEventListener("pointerleave", () => { $("tip").hidden = true; });
  const setPlay = on => { $("playIc").innerHTML = on ? `<path d="M7 4h4v16H7zM13 4h4v16h-4z" fill="currentColor"/>` : `<path d="M7 4v16l13-8z" fill="currentColor"/>`; $("play").setAttribute("aria-label", on ? "Pause" : "Play"); };
  $("play").addEventListener("click", () => setPlay(E.play())); E.onPlay = setPlay;
  const SPEEDS = [0.5, 1, 1.5, 2];
  $("speed").addEventListener("click", () => { const s = SPEEDS[(SPEEDS.indexOf(E.speed) + 1) % SPEEDS.length]; E.setSpeed(s); $("speed").textContent = s.toFixed(1) + "x"; });
  let spinning = false;
  $("spin").addEventListener("click", () => { spinning = !spinning; $("spin").setAttribute("aria-pressed", String(spinning)); if (spinning) setFollow(false); });
  setInterval(() => { if (spinning) E.look(E.yaw + 0.25); }, 16);
  const fsToggle = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
  $("fs").addEventListener("click", fsToggle); $("fsTop").addEventListener("click", fsToggle);
  setInterval(() => {
    const st = E.state; if (!st) return;
    $("tNow").textContent = fmt(st.t); $("tDur").textContent = fmt(st.duration);
    const p = st.duration ? st.t / st.duration * 100 : 0; $("thumb").style.left = p + "%"; $("done").style.width = p + "%";
  }, 100);

  // ---- header: walk menu ----
  $("placeBtn").addEventListener("click", () => { const m = $("walkMenu"); m.hidden = !m.hidden; $("placeBtn").setAttribute("aria-expanded", String(!m.hidden)); });
  document.querySelectorAll("#walkMenu button").forEach(b => b.addEventListener("click", async () => {
    document.querySelectorAll("#walkMenu button").forEach(x => x.setAttribute("aria-checked", String(x === b)));
    $("walkMenu").hidden = true; pinned.length = 0; $("walkName").textContent = `· ${E.walkLabel(b.dataset.walk)}`; await load(b.dataset.walk);
  }));

  // ---- tool rail + popovers ----
  const pops = { tLayers: "layersPop", tSearch: "searchPop", tStats: "statsPop" };
  const closePops = except => { for (const [b, p] of Object.entries(pops)) if (p !== except) { $(p).hidden = true; $(b).setAttribute("aria-pressed", "false"); } };
  for (const [b, p] of Object.entries(pops)) $(b).addEventListener("click", () => { const open = $(p).hidden; closePops(p); $(p).hidden = !open; $(b).setAttribute("aria-pressed", String(open)); if (open && p === "searchPop") $("searchIn").focus(); });
  $("setBtn").addEventListener("click", () => $("tLayers").click());
  // outside clicks close Layers/Search; the statistics panel stays open while you watch
  document.addEventListener("pointerdown", ev => { if (!ev.target.closest(".pop, .rail, #setBtn")) closePops("statsPop"); if (!ev.target.closest("#walkMenu, #placeBtn")) $("walkMenu").hidden = true; });
  $("tCenter").addEventListener("click", () => { spinning = false; $("spin").setAttribute("aria-pressed", "false"); setFollow(true); E.fov = 90; E.look(E.yaw, -5); });
  const toast = t => { const el = $("toast"); el.textContent = t; el.hidden = false; el.style.opacity = 1; clearTimeout(toast.h); toast.h = setTimeout(() => { el.style.opacity = 0; setTimeout(() => el.hidden = true, 400); }, 1800); };
  $("tMark").addEventListener("click", () => { const st = E.state; if (!st) return; bookmarks[E.walk].push(st.fi); renderMarks(); toast(`Bookmarked ${fmt(st.t)}`); });
  $("searchIn").addEventListener("keydown", ev => {
    ev.stopPropagation();                      // keep typing out of the viewer's keyboard shortcuts
    if (ev.key !== "Enter") return;
    const id = parseInt($("searchIn").value.replace(/\D/g, ""), 10), t = E.data && E.data.tracks[id];
    if (!t) { $("searchHint").textContent = `No person P${isNaN(id) ? "?" : id} on this walk.`; return; }
    E.seekFrame(t[0] + 1); pin({ kind: "person", id }); closePops(); setFollow(false); $("searchHint").textContent = "Jumps to when they first appear and opens their card.";
    setTimeout(() => { const F = E.data.frames[t[0] + 1], r = F && F.p.find(x => x[0] === id); if (r) E.look(r[2]); }, 300);
  });
  document.querySelectorAll("[data-show]").forEach(i => i.addEventListener("change", () => {
    show[i.dataset.show] = i.checked; const chip = document.querySelector(`.chip[data-k="${i.dataset.show}"]`); if (chip) chip.setAttribute("aria-pressed", String(i.checked)); autoAt = 0;
  }));
  document.querySelectorAll(".chip").forEach(ch => ch.addEventListener("click", () => {
    const k = ch.dataset.k; show[k] = !show[k]; ch.setAttribute("aria-pressed", String(show[k])); const i = document.querySelector(`[data-show="${k}"]`); if (i) i.checked = show[k]; autoAt = 0;
  }));
  $("conf").addEventListener("input", () => { E.conf = +$("conf").value; $("confLbl").textContent = E.conf.toFixed(2); if (E.data) buildTrends(E.data); });

  load("walk1");
})();
</script>
</body>
</html>
